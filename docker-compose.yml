services:
  # 1. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: personal-kb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./personal-kb/qdrant_storage:/qdrant/storage
    networks:
      - kb-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 2. Personal Knowledge Base Application & Web UI
  app:
    build:
      context: ./personal-kb
      dockerfile: Dockerfile
    container_name: personal-kb-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATA_DIR=/app/data
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./personal-kb/.env
    volumes:
      - ./personal-kb/data:/app/data
      - ./personal-kb/qdrant_storage:/app/qdrant_storage
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - kb-network

  # 3. Optional Auto-Deploy Agent (Watchtower)
  # Run with: docker compose --profile auto-update up -d
  watchtower:
    image: containrrr/watchtower
    container_name: personal-kb-watchtower
    restart: unless-stopped
    profiles:
      - auto-update
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    networks:
      - kb-network

networks:
  kb-network:
    driver: bridge
